
name: Build Pojav Sodium

on:
  workflow_dispatch:
  push:
    paths:
      - 'sodium-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Sodium for Pojav
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract Sodium source
        run: |
          mkdir -p upstream
          unzip -q sodium-source.zip -d upstream

      - name: Compile Sodium
        shell: bash
        run: |
          set -e

          GRADLEW=$(find upstream -type f \
            -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew build --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/output"

          find build/mods -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Pojav-Sodium-Baseline
          path: output/*.jar
          if-no-files-found: error
